name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Cross-compile
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install UPX
        run: |
          sudo apt-get update
          sudo apt-get install -y upx-ucl
          upx --version | head -1

      - name: Build dist and checksums
        run: make snapshot

      - name: Verify checksums
        run: cd dist && sha256sum -c checksums.txt

      - name: Verify the linux artifacts are packed
        run: |
          for f in dist/kimi-ssh_*_linux_*; do
            upx -t "$f" >/dev/null || { echo "::error::$f is not UPX-packed"; exit 1; }
          done

      - name: Upload dist
        uses: actions/upload-artifact@v7
        with:
          name: kimi-ssh-dist
          path: dist/
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download dist
        uses: actions/download-artifact@v8
        with:
          name: kimi-ssh-dist
          path: dist

      - name: Attach assets to the tag release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" dist/* --verify-tag --title "$tag" --generate-notes --repo "$GITHUB_REPOSITORY"
          fi
